<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
  <meta charset="UTF-8">
  <title>Le tue statistiche</title>
</head>
<body style="margin:0; padding:24px 0; background:#f6f7f9;
             font-family: Arial, Helvetica, sans-serif; color:#1c1f24;">

<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
       align="center" style="width:600px; max-width:100%; background:#ffffff;
       border:1px solid #d5d8dd; border-radius:8px;">
  <tr>
    <td style="padding:24px;">

      <h1 th:text="'Ciao ' + ${username} + ','"
          style="margin:0 0 12px; font-size:22px; color:#061e37;">
        Ciao Alberto,
      </h1>

      <p style="margin:0 0 20px; font-size:15px; line-height:1.5;">
        ecco un riepilogo della tua attivita' in chat:
      </p>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="margin-bottom:8px;">
        <tr>
          <td style="padding:10px 0; border-bottom:1px solid #eef0f3; font-size:15px;">
            Messaggi inviati
          </td>
          <td style="padding:10px 0; border-bottom:1px solid #eef0f3; font-size:15px;
                     text-align:right; font-weight:bold;" th:text="${messaggiInviati}">0</td>
        </tr>
        <tr>
          <td style="padding:10px 0; border-bottom:1px solid #eef0f3; font-size:15px;">
            Messaggi ricevuti
          </td>
          <td style="padding:10px 0; border-bottom:1px solid #eef0f3; font-size:15px;
                     text-align:right; font-weight:bold;" th:text="${messaggiRicevuti}">0</td>
        </tr>
        <tr>
          <td style="padding:10px 0; font-size:15px;">
            Chat aperte
          </td>
          <td style="padding:10px 0; font-size:15px; text-align:right; font-weight:bold;"
              th:text="${chatAperte}">0</td>
        </tr>
      </table>

    </td>
  </tr>
</table>

</body>
</html>
