spring.application.name=BE

# --- Database (Postgres) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db-PS2U5}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Email (Gmail SMTP) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.mittente=${MAIL_FROM:alberto.razzolini@gmail.com}

# --- IA (OpenRouter, protocollo compatibile OpenAI) ---
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=${LLM_READ_TIMEOUT:120s}
spring.threads.virtual.enabled=true

app.llm.base-url=${LLM_BASE_URL:https://openrouter.ai/api/v1}
app.llm.api-key=${OPENROUTER_API_KEY:}
app.llm.model=${LLM_MODEL:nex-agi/nex-n2.5-mini:free}
app.llm.max-tokens=${LLM_MAX_TOKENS:4096}
app.llm.reasoning=${LLM_REASONING:true}

# --- CORS (frontend Vite/React) ---
app.cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}

logging.level.it.epicode=INFO
